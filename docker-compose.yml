version: '3.8'

services:
  # ==========================================
  # Operational Database: PostgreSQL 16
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: pharma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pharma_traceability_db
      POSTGRES_USER: pharma_admin
      POSTGRES_PASSWORD: pharma_secure_password_123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seeds/001_initial_seed_data.sql:/docker-entrypoint-initdb.d/02_seeds.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharma_admin -d pharma_traceability_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pharma-network

  # ==========================================
  # Object Storage: MinIO (S3-Compatible)
  # ==========================================
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: pharma-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin_user
      MINIO_ROOT_PASSWORD: minio_secure_password_123
    ports:
      - "9000:9000"   # API Port
      - "9001:9001"   # Web Console Port
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - pharma-network

volumes:
  pgdata:
    driver: local
  miniodata:
    driver: local

networks:
  pharma-network:
    driver: bridge

